# ======================================================================================
# adrf6850.conf -- configuración inicial del ADRF6850 (placa RECEPTOR_AIS_BLK_R00, U9)
# ======================================================================================
# Es la configuración del receptor AIS (canal A) y la única fuente de la inicialización: el driver no tiene valores
# por defecto. Todas las claves son obligatorias (salvo lo_hz). Una clave ausente, repetida, desconocida o fuera de
# rango es un error: el servidor no arranca y lo informa con el número de línea, sin tocar el hardware.
#
# Ubicación en la Red Pitaya: /media/mmcblk0p1/apps/adrf6850.conf (la raíz de Alpine está en RAM)
# Uso:  ./adrf_server -c /media/mmcblk0p1/apps/adrf6850.conf        (el cliente manda CMD_ADRF_INIT)
#       ./adrf_server -c /media/mmcblk0p1/apps/adrf6850.conf -a     (hace el init al arrancar)
#

# --- Señal a recibir -------------------------------------------------------------------
f_rf_hz  = 161975000  # canal A de AIS. La entrada J1 pasa por un filtro de 156 a 162 MHz (FB1):
                      #   el canal B (162,025 MHz) queda en su borde y no se usa.
f_fi_hz  = 10700000   # LO = f_rf_hz - f_fi_hz. Las salidas J5 y J6 llevan un pasabajos LC de
                      #   ~15 MHz (inferido): la FI debe quedar por debajo de ~13 MHz.
corr_ppm = 0.0        # [LIBRE] error de la referencia U2 en ppm: (f_medida - f_pedida) / f_pedida * 1e6 con la frecuencia del LOMON, o
                      #   (f_medida_en_REFIN - refin_hz) / refin_hz * 1e6. El LO que se pide es LO_nominal / (1 + corr_ppm * 1e-6).
                      #   El notebook (sección 7b) lo calcula a partir del LOMON.
#lo_hz   = 151275000  # opcional: LO explícito en Hz; si se define, f_rf_hz, f_fi_hz y corr_ppm dejan de ser obligatorias.

# --- Banda base ------------------------------------------------------------------------
bb_wideband = 0       # [LIBRE] 0 = narrow-band, 1 = wideband.
bb_fc_mhz   = 30      # [LIBRE] corte del filtro narrow-band del chip: 50 | 43 | 37 | 30 MHz.
vocm_interno = 1      # 1 = modo común interno.

# --- PLL -------------------------------------------------------------------------------
cp_code = 7           # [LIBRE] corriente de la bomba de carga.
muxout  = 0           # sin efecto. función de MUXOUT, pin no conectado.
autocal_us = 100      # [LIBRE] tiempo de autocalibración en µs (da CR25); 100 es el recomendado.
lock_timeout_us = 2000  # sin efecto. LDET va al LED D3, no a un GPIO.

# --- Enlace SPI ------------------------------------------------------------------------
verify_retries = 3    # [LIBRE] cada registro escrito se lee de vuelta por SDO; si no coincide se reescribe, hasta este número
                      #   de reintentos (0 a 3). Si no coincide ni así, el init falla. 0 = no verifica.

# --- Referencia ------------------------------------------------------------------------
refin_hz     = 13500000  # frecuencia en REFIN la da el cristal.
ref_doblador = 0      # [LIBRE] doblador de la referencia. PFD = refin_hz * (1 + doblador) / (ref_rdiv * (1 + ref_div2)), entre
ref_div2     = 0      #   10 y 30 MHz (el driver lo valida). El filtro de lazo (R7 a R9, C29 a C31, C34) es el de la hoja de
ref_rdiv_en  = 0      #   datos para PFD = 27 MHz: dejar ref_doblador = 1. ref_rdiv (1 a 32) solo cuenta si ref_rdiv_en = 1.
ref_rdiv     = 1

# --- LO monitor ------------------------------------------------------------------------
lomon_en      = 0     # [LIBRE] 0 = apagado (uso normal), 1 = encendido.
lomon_pwr_dbm = -24   # [LIBRE] nivel si está encendido: -24 | -18 | -12 | -6.

# --- Ganancia --------------------------------------------------------------------------
gain_mdb = 40000      # [HARDWARE: SIN DAC] en mili-dB (40000 = 40 dB = 1000 mV en J2, a 25 mV/dB). VGAIN (pin 43) viene solo de
                      #   J2: el servidor imprime la tensión que hay que aplicar.
vga_pendiente = 0     # [LIBRE] 0 = positiva (0 V = 0 dB, 1,5 V = 60 dB), 1 = negativa.
