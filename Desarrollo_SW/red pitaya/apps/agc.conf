# ======================================================================================
# agc.conf -- parametros del AGC del receptor AIS (servidor adrf_server_dacreg, opcion -g)
# ======================================================================================
# Todas las claves son obligatorias. Una clave ausente, repetida, desconocida o fuera de rango es un error: el servidor no
# arranca y lo informa con el numero de linea. El AGC solo funciona con el DAC activado (-d).
#
# Ubicacion en la Red Pitaya: /media/mmcblk0p1/apps/agc.conf
# Uso:  ./adrf_server_dacreg -c /media/mmcblk0p1/apps/adrf6850.conf -a -d -g /media/mmcblk0p1/apps/agc.conf
#
# Formato:  clave = valor     (# comenta hasta el fin de linea)

activo             = 1      # 1: el AGC arranca activado y lleva la ganancia a g_inicial_db en cuanto el ADRF esta inicializado
g_inicial_db       = 20.0   # ganancia fija conocida con que arranca (sin rafagas el AGC no se mueve)

# --- Referencia ---------------------------------------------------------------------
objetivo           = 550    # nivel pico al que se lleva la referencia
ventana            = 8      # rafagas en la ventana
percentil          = 85     # percentil de la ventana; 100 = maximo. Un percentil menor que 100 ignora una rafaga aislada mucho mas fuerte
zona_muerta_db     = 0.5    # no corrige si la referencia esta a menos de esto del objetivo

# --- Ataque y liberacion ------------------------------------------------------------
kp                 = 0.7    # fraccion del error que corrige en cada ataque
paso_max_db        = 3.0    # paso maximo por rafaga
liberacion_rafagas = 8      # rafagas bajas seguidas antes de subir la ganancia
paso_liberacion_db = 1.0    # paso al subir
nivel_proteccion   = 1100   # un pico sobre este nivel baja paso_max_db de inmediato (el corte de seguridad del notebook es 1500)

# --- Ganancia -----------------------------------------------------------------------
g_min_db           = 3.0    # los primeros ~3 dB del VGA casi no cambian el nivel
g_max_db           = 30.0   # tope con la pendiente positiva del VGA
planta             = 1.24   # dB de nivel por dB de ganancia pedida (medido en el punto de trabajo)
